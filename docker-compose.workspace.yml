services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postcard_bot
      POSTGRES_USER: postcard
      POSTGRES_PASSWORD: postcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postcard -d postcard_bot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://postcard:postcard@postgres:5432/postcard_bot
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend-worker:
    build:
      context: .
    restart: unless-stopped
    command: sh -c "python -m postcard_backend.scripts.migrate && celery -A postcard_backend.tasks.celery_app:celery_app worker -l info"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://postcard:postcard@postgres:5432/postcard_bot
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ../postcard_max_frontend
    restart: unless-stopped
    env_file:
      - ../postcard_max_frontend/.env
    environment:
      BACKEND_BASE_URL: http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_started
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  minio_data:
