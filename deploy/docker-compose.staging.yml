version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-03-03T17-29-03Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  backend-api:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend-worker:
    build:
      context: ..
    restart: unless-stopped
    command: sh -c "python -m postcard_backend.scripts.migrate && celery -A postcard_backend.tasks.celery_app:celery_app worker -l info"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ../../postcard_max_frontend
    restart: unless-stopped
    env_file:
      - ../../postcard_max_frontend/.env
    environment:
      BACKEND_BASE_URL: http://backend-api:8000
    depends_on:
      - backend-api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-api
      - frontend

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
